<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <!-- Social preview image. After editing, re-export it as og-image.png at 1200×630. -->
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#e7e5e4" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="8%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#fade)"/>
    </mask>
    <radialGradient id="glow" cx="100%" cy="0%" r="70%">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#fafaf9"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="14" height="630" fill="#0f766e"/>

  <!-- Monogram -->
  <rect x="96" y="92" width="76" height="76" rx="18" fill="#1c1917"/>
  <text x="134" y="142" text-anchor="middle" font-size="30" font-weight="700" fill="#fafaf9" letter-spacing="1">NC</text>
  <text x="196" y="124" font-size="30" font-weight="600" fill="#1c1917">Nandini Choudhary</text>
  <text x="196" y="158" font-size="22" fill="#57534e">Freelance Web Developer</text>

  <!-- Headline -->
  <text x="96" y="318" font-size="88" font-weight="700" fill="#1c1917" letter-spacing="-2.5">Websites for</text>
  <text x="96" y="412" font-size="88" font-weight="700" fill="#0f766e" letter-spacing="-2.5">local businesses</text>

  <!-- What I build -->
  <g font-size="24" font-weight="600" fill="#1c1917">
    <rect x="96" y="470" width="232" height="52" rx="26" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
    <text x="212" y="504" text-anchor="middle">Business websites</text>
    <rect x="344" y="470" width="184" height="52" rx="26" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
    <text x="436" y="504" text-anchor="middle">Online stores</text>
    <rect x="544" y="470" width="146" height="52" rx="26" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
    <text x="617" y="504" text-anchor="middle">Redesigns</text>
  </g>

  <text x="96" y="576" font-size="24" fill="#57534e">Muzaffarnagar, Uttar Pradesh  ·  Working with clients across India</text>
</svg>
